<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>10 configuraciones de seguridad que puedes activar hoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background:transparent; }
  body { font-family:'Inter',sans-serif; }
  .frame { width:1600px; position:relative; overflow:hidden; background:#F4F7FC; box-sizing:border-box; transform-origin:top left; }
  .logo-badge { position:absolute; top:52px; right:60px; height:60px; z-index:4; }
  .pad { position:relative; padding:138px 56px 52px; box-sizing:border-box; }
  .kicker { display:flex; align-items:center; gap:10px; margin-bottom:30px; }
  .kicker .bar { width:34px; height:4px; border-radius:2px; background:#3178BD; }
  .kicker span { font-size:20px; font-weight:700; letter-spacing:.10em; color:#3178BD; text-transform:uppercase; }
  h1 { margin:0 0 44px; font-family:'Plus Jakarta Sans',sans-serif; font-size:44px; font-weight:800; line-height:1.2; color:#0E1F42; max-width:1300px; }
  .list { display:flex; flex-direction:column; gap:18px; }
  .item { background:#fff; border:1.5px solid #B9CBEA; border-radius:18px; padding:24px 26px; display:flex; gap:18px; align-items:center; box-shadow:0 4px 14px rgba(31,56,100,.09); box-sizing:border-box; cursor:pointer; user-select:none; }
  .item .box { width:38px; height:38px; border-radius:9px; border:3px solid #3178BD; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s; }
  .item.checked .box { background:#3178BD; }
  .item .box svg { display:none; }
  .item.checked .box svg { display:block; }
  .item .content { display:flex; flex-direction:column; gap:8px; flex:1; }
  .item .ttl { font-family:'Plus Jakarta Sans',sans-serif; font-size:24px; font-weight:800; color:#152A52; line-height:1.3; }
  .item .row { font-size:20px; color:#243352; line-height:1.5; }
  .item .row b { color:#1F5DA6; font-weight:700; }
  .item .icon { width:70px; height:70px; border-radius:50%; background:#DCE9FB; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .foot { border-top:1px solid #DCE4F2; padding-top:20px; margin-top:36px; }
  .foot span { font-size:20px; color:#6B7A96; line-height:1.5; }
</style>
</head>
<body>
<div class="frame">
  <img class="logo-badge" src="../Logo.png" alt="Logo" />
  <div class="pad">
    <div class="kicker"><span class="bar"></span><span>Checklist de seguridad</span></div>
    <h1>10 configuraciones de seguridad que puedes activar hoy</h1>

    <div class="list" id="list"></div>

    <div class="foot"><span>Fuente: CISA Secure Our World 2024 · NIST SP 800-124 · MinTIC Colombia — Guía de seguridad digital 2023</span></div>
  </div>
</div>
<script>
  var ICONS = {
    lock: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="#1F5DA6" stroke-width="2" fill="none"/><path d="M8 11V8a4 4 0 0 1 6.5-3.1" stroke="#1F5DA6" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
    pin: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#1F5DA6" stroke-width="2" fill="none"/><circle cx="12" cy="10.5" r="3" stroke="#1F5DA6" stroke-width="2" fill="none"/><path d="M6.5 18a6 6 0 0 1 11 0" stroke="#1F5DA6" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
    cifrado: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="4" y="8" width="16" height="12" rx="2" stroke="#1F5DA6" stroke-width="2" fill="none"/><path d="M8 8V6a4 4 0 0 1 8 0v2" stroke="#1F5DA6" stroke-width="2" fill="none"/><circle cx="12" cy="14" r="1.8" fill="#1F5DA6"/></svg>',
    wifi: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M4 9a13 8 0 0 1 16 0" stroke="#1F5DA6" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M7.2 12.7a8 5 0 0 1 9.6 0" stroke="#1F5DA6" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="17" r="1.8" fill="#1F5DA6"/></svg>',
    wifiOff: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M4 9a13 8 0 0 1 16 0" stroke="#1F5DA6" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M7.2 12.7a8 5 0 0 1 9.6 0" stroke="#1F5DA6" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="17" r="1.8" fill="#1F5DA6"/><line x1="3" y1="20" x2="21" y2="4" stroke="#1F5DA6" stroke-width="2" stroke-linecap="round"/></svg>',
    location: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z" stroke="#1F5DA6" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="#1F5DA6" stroke-width="2" fill="none"/></svg>',
    mic: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="#1F5DA6" stroke-width="2" fill="none"/><path d="M6 11a6 6 0 0 0 12 0" stroke="#1F5DA6" stroke-width="2" fill="none" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="21" stroke="#1F5DA6" stroke-width="2" stroke-linecap="round"/></svg>',
    find: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="#1F5DA6" stroke-width="2" fill="none"/><line x1="15.3" y1="15.3" x2="21" y2="21" stroke="#1F5DA6" stroke-width="2.2" stroke-linecap="round"/><circle cx="10.5" cy="10.5" r="2" fill="#1F5DA6"/></svg>',
    sessions: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="12" rx="2" stroke="#1F5DA6" stroke-width="2" fill="none"/><line x1="8" y1="20" x2="16" y2="20" stroke="#1F5DA6" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="20" stroke="#1F5DA6" stroke-width="2"/></svg>',
    bank: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M4 10l8-5 8 5" stroke="#1F5DA6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="5" y="10" width="14" height="8" stroke="#1F5DA6" stroke-width="2" fill="none"/><line x1="3" y1="20" x2="21" y2="20" stroke="#1F5DA6" stroke-width="2" stroke-linecap="round"/></svg>'
  };
  var DATA = [
    { icon: 'lock', title: 'Bloqueo de pantalla automático', activa: 'Configuración > Pantalla > Tiempo de espera en 30 segundos o 1 minuto.', porque: 'Si pierdes el celular o alguien accede físicamente, no podrá entrar sin tu PIN o huella.' },
    { icon: 'pin', title: 'PIN / Huella / Reconocimiento facial', activa: 'Configuración > Seguridad > Bloqueo de pantalla. Usa un PIN de al menos 6 dígitos o biometría.', porque: 'Es la primera barrera física de tu dispositivo.' },
    { icon: 'cifrado', title: 'Cifrado del dispositivo', activa: 'Android moderno y iPhone cifran automáticamente. En Windows: Configuración > Seguridad de Windows > Cifrado del dispositivo.', porque: 'Si alguien extrae el disco de tu computador, no podrá leer los archivos sin tu clave.' },
    { icon: 'wifi', title: 'Desactivar WiFi y Bluetooth cuando no los usas', activa: 'Panel de notificaciones > apagar WiFi y Bluetooth si no los necesitas.', porque: 'Reduce la superficie de ataque y el consumo de batería.' },
    { icon: 'wifiOff', title: 'Desactivar conexión automática a redes WiFi', activa: 'Configuración > WiFi > desactivar "Conectar automáticamente".', porque: 'Evita que el celular se conecte automáticamente a redes públicas o redes falsas con nombres conocidos.' },
    { icon: 'location', title: 'Revisar apps con acceso a tu ubicación', activa: 'Configuración > Privacidad > Ubicación. Revisa qué apps tienen acceso y cambia a "Solo al usar la app" cuando sea posible.', porque: 'Muchas apps rastrean tu ubicación en segundo plano sin que lo sepas.' },
    { icon: 'mic', title: 'Desactivar micrófono y cámara para apps que no los necesitan', activa: 'Configuración > Privacidad > Micrófono / Cámara. Revoca el permiso de apps que no tienen razón para tenerlo.', porque: 'Algunas apps acceden al micrófono en segundo plano.' },
    { icon: 'find', title: 'Activar "Encontrar mi dispositivo"', activa: 'Android: Configuración > Seguridad > Encontrar mi dispositivo. iPhone: Configuración > Apple ID > Buscar.', porque: 'Si pierdes el celular, puedes localizarlo, bloquearlo remotamente o borrar todos los datos.' },
    { icon: 'sessions', title: 'Revisar cuentas y sesiones activas en tus servicios', activa: 'En Gmail: Mi cuenta > Seguridad > Tus dispositivos. En Facebook e Instagram: Configuración > Seguridad > Sesiones activas.', porque: 'Puedes ver si hay sesiones abiertas en dispositivos que no reconoces y cerrarlas.' },
    { icon: 'bank', title: 'Activar alertas de actividad inusual en cuentas bancarias', activa: 'En Bancolombia, Nequi, Daviplata y otros: activa las notificaciones push para cada transacción.', porque: 'Recibes una alerta inmediata si hay una transacción que no hiciste tú.' }
  ];
  var CHECK_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4.5 12.5l5 5L20 7" stroke="white" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var list = document.getElementById('list');
  DATA.forEach(function (d, i) {
    var el = document.createElement('div');
    el.className = 'item';
    el.innerHTML =
      '<div class="box">' + CHECK_SVG + '</div>' +
      '<div class="content">' +
        '<span class="ttl">' + (i + 1) + '. ' + d.title + '</span>' +
        '<span class="row"><b>Activa:</b> ' + d.activa + '</span>' +
        '<span class="row"><b>Por qué:</b> ' + d.porque + '</span>' +
      '</div>' +
      '<div class="icon">' + ICONS[d.icon] + '</div>';
    el.addEventListener('click', function () { el.classList.toggle('checked'); });
    list.appendChild(el);
  });

  (function () {
    var frame = document.querySelector('.frame'), W = 1600;
    function fit() {
      var s = window.innerWidth / W;
      frame.style.transform = 'scale(' + s + ')';
      var realH = Math.round(frame.offsetHeight * s);
      document.body.style.height = realH + 'px';
      if (window.parent) { window.parent.postMessage({ type: 'infographic-height', height: realH }, '*'); }
    }
    window.addEventListener('resize', fit); fit();
  })();
</script>
</body>
</html>
